<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2715%27 fill=%27%23ec5f18%27/%3E%3Cpath d=%27M21.4 9.4H10.9l5.6 6.6-5.6 6.6h10.5%27 fill=%27none%27 stroke=%27white%27 stroke-width=%272.6%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
<meta name="description" content="L'explorer per Ergo che interpreta: ogni transazione spiegata in una riga, pagella dei token, salute dei protocolli. Nessun account, nessun tracciamento.">
<link rel="canonical" href="https://ergologica.github.io/robespierre/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Robespierre">
<meta property="og:title" content="Robespierre — l'explorer che interpreta">
<meta property="og:description" content="Gli explorer elencano dati. Questo li spiega: «Rosen Bridge: arrivo di 9.950,99 ERG» invece di una tabella di box.">
<meta property="og:url" content="https://ergologica.github.io/robespierre/">
<meta property="og:image" content="https://ergologica.github.io/robespierre/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Robespierre: gli explorer elencano, questo spiega. Due transazioni Ergo decodificate in linguaggio piano.">
<meta property="og:locale" content="it_IT">
<meta property="og:locale:alternate" content="en_US">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#1a2026" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<title>Robespierre — l'explorer che interpreta</title>
</head>
<body>
<header>
  <div class="wrap">
    <a class="brand" href="#/">
      <svg class="logo" viewBox="0 0 32 32" aria-label="Ergo" role="img">
        <defs><linearGradient id="ergo" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ff8a3d"/><stop offset="1" stop-color="#e2560d"/>
        </linearGradient></defs>
        <circle cx="16" cy="16" r="15" fill="url(#ergo)"/>
        <path d="M21.4 9.4H10.9l5.6 6.6-5.6 6.6h10.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="nm">Robespierre</span>
      <span class="sub" data-t="sub_brand">explorer per Ergo</span>
    </a>
    <nav class="topnav">
      <a href="#/" data-ic="net"><span data-t="nav_net">Rete</span></a>
      <a href="#/mercati" data-ic="swap"><span data-t="nav_markets">Mercati</span></a>
      <a href="#/tokens" data-ic="token"><span data-t="nav_tokens">Token</span></a>
      <a href="#/protocolli" data-ic="shield"><span data-t="nav_protocols">Protocolli</span></a>
    </nav>
    <span class="grow"></span>
    <div class="seg" role="group" aria-label="Livello di dettaglio">
      <button type="button" id="modeBase" aria-pressed="true" data-t="base">Base</button>
      <button type="button" id="modeAdv" aria-pressed="false" data-t="adv">Avanzato</button>
    </div>
    <button class="ghost" id="langBtn" type="button" aria-label="Language / Lingua">EN</button>
    <button class="ghost" id="themeBtn" type="button" aria-label="Cambia tema" data-ic="theme"></button>
  </div>
</header>
<div class="wrap searchrow">
  <form class="search" id="searchForm">
    <span class="dim" data-ic="search" aria-hidden="true"></span>
    <input id="searchInput" type="text" autocomplete="off" spellcheck="false"
      placeholder="Indirizzo, transazione, token, blocco — riconosciuti automaticamente">
    <span class="kbd">/</span>
    <button class="go" type="submit" aria-label="Cerca">→</button>
  </form>
</div>
<main class="wrap" id="app" tabindex="-1"></main>
<footer class="wrap">
  <span>Robespierre · <span data-t="footer_src">prototipo — dati dall'Explorer API di Ergo</span></span>
  <span data-t="footer_truth">i saldi fanno fede sulla catena, non qui</span>
</footer>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
