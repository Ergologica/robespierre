name: deploy
on:
  # I job dei dati (holders, prezzi, protocolli, copertura) committano in data/ fino a
  # sei volte al giorno. Il sito quei file li legge da raw.githubusercontent, non dal
  # bundle: ricostruirlo a ogni commit di dati era lavoro inutile. Un push che tocca
  # anche un solo file fuori da data/ fa ripartire il deploy come prima.
  push: { branches: [main], paths-ignore: ['data/**'] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      - uses: actions/deploy-pages@v4
